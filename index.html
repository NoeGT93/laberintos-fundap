<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de laberintos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js"></script>
<style>
  :root{--bg:#faf7f5;--ink:#2b2b2b;--accent:#e36a8c;--panel:#fff;--line:#e6dfdb}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  h1{font-size:22px;margin:0 0 4px}
  .app{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:20px;max-width:1200px;margin:auto}
  @media(max-width:820px){.app{grid-template-columns:1fr;padding:16px}}
  .panel,.preview{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
  button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
  button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg{display:flex;gap:6px}.seg button{flex:1}
  .ans{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .muted{color:#888;font-size:13px}
  #page{width:100%;height:auto;display:block;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>Laberintos</h1>
    <div class="muted">Un inicio y 3 salidas (A, B, C). Solo la salida de la respuesta correcta conecta con el inicio.</div>

    <label>Forma</label>
    <select id="shape">
      <option value="cuadrado">Cuadrado</option>
      <option value="anillos">Circular (anillos)</option>
      <option value="circulo">Circular (cuadrícula)</option>
      <option value="hexagono">Hexágono</option>
      <option value="triangulo">Triángulo</option>
      <option value="corazon">Corazón</option>
    </select>

    <label>Nivel</label>
    <div class="seg" id="level">
      <button data-v="0" class="on">1</button><button data-v="1">2</button><button data-v="2">3</button><button data-v="3">4</button><button data-v="4">5</button>
    </div>

    <label>Título</label>
    <input type="text" id="title" value="Laberinto">
    <label>Instrucción / pregunta</label>
    <input type="text" id="subtitle" value="¿Cuál es la respuesta correcta? Encuentra el camino.">

    <label>Respuestas <span class="muted">(marca la correcta)</span></label>
    <div id="answers"></div>

    <label>Líneas</label>
    <div class="row" style="margin-top:0">
      <input type="color" id="color" value="#5b2f36">
      <input type="range" id="width" min="0.4" max="2.5" step="0.1" value="1.2" style="flex:1">
    </div>
    <div class="row"><label style="margin:0;font-weight:400"><input type="checkbox" id="solution"> Mostrar solución</label></div>

    <div class="row">
      <button class="primary" id="new">Nuevo laberinto</button>
      <span class="muted">semilla <span id="seedTxt"></span></span>
    </div>
    <div class="row">
      <button id="pdf">Descargar PDF (+ solución)</button>
      <button id="svg">Descargar SVG + solución (Illustrator)</button>
    </div>
  </div>
  <div class="preview"><svg id="page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297"></svg></div>
</div>

<script>
// ---------- utilidades ----------
function mulberry(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>+n.toFixed(2);

const LEVEL_GRID=[8,12,18,24,32], LEVEL_RINGS=[5,8,11,14,18];
const MASKS={
  cuadrado:()=>true,
  circulo:(u,v)=>u*u+v*v<=1,
  hexagono:(u,v)=>Math.abs(v)<=0.866&&1.732*Math.abs(u)+Math.abs(v)<=1.732,
  triangulo:(u,v)=>Math.abs(u)<=(v+1)/2+0.02,
  corazon:(u,v)=>{const x=u*1.15,y=-v*1.15+0.12,a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}
};
// Área del laberinto en la página (mm)
const BX=20,BY=46,BS=170;

// ---------- grafos ----------
function gridGraph(n,mask){
  let cells=new Set();
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(mask((x+.5)/n*2-1,(y+.5)/n*2-1))cells.add(y*n+x);
  const nbAll=id=>{const x=id%n,y=(id-x)/n,o=[];
    if(y>0)o.push(id-n);if(y<n-1)o.push(id+n);if(x>0)o.push(id-1);if(x<n-1)o.push(id+1);
    return o.filter(d=>cells.has(d))};
  // quedarse con la región conectada que contiene el centro
  let c0=[...cells].sort((a,b)=>Math.hypot(a%n-n/2,(a-a%n)/n-n/2)-Math.hypot(b%n-n/2,(b-b%n)/n-n/2))[0];
  const seen=new Set([c0]),q=[c0];for(let i=0;i<q.length;i++)for(const d of nbAll(q[i]))if(!seen.has(d)){seen.add(d);q.push(d)}
  cells=seen;
  const xy=id=>[id%n,Math.floor(id/n)];
  // inicio: celda del borde superior más cercana al centro horizontal
  const start=[...cells].filter(id=>!cells.has(id-n)).sort((a,b)=>Math.abs(xy(a)[0]+.5-n/2)-Math.abs(xy(b)[0]+.5-n/2)||a-b)[0];
  // salidas: celda más baja de las columnas al 20%, 50% y 80%
  const exits=[];
  for(const t of [.2,.5,.8]){
    for(let dx=0;dx<n;dx++){
      const col=Math.round(n*t-.5)+(dx%2?-1:1)*Math.ceil(dx/2);
      const ids=[...cells].filter(id=>id%n===col);
      if(!ids.length)continue;const e=Math.max(...ids);
      if(e!==start&&!exits.includes(e)){exits.push(e);break}
    }
  }
  return{kind:'grid',n,cells,nb:nbAll,start,exits,xy};
}

function thetaGraph(rows){
  const counts=[1];for(let r=1;r<rows;r++)counts.push(counts[r-1]*Math.max(1,Math.round(2*Math.PI*r/counts[r-1])));
  const off=[0];for(let r=1;r<rows;r++)off.push(off[r-1]+counts[r-1]);
  const ri=id=>{let r=rows-1;while(off[r]>id)r--;return[r,id-off[r]]};
  const nb=id=>{const[r,i]=ri(id),n=counts[r],o=[];
    if(r>0){o.push(off[r]+(i+1)%n,off[r]+(i+n-1)%n);
      o.push(r===1?0:off[r-1]+Math.floor(i/(n/counts[r-1])))}
    if(r<rows-1){const k=counts[r+1]/n;for(let j=0;j<k;j++)o.push(off[r+1]+i*k+j)}
    return o};
  const last=rows-1,n=counts[last];
  const exits=[Math.PI/2+0.6,Math.PI/2,Math.PI/2-0.6].map(a=>off[last]+Math.floor(a/(2*Math.PI)*n));
  return{kind:'theta',rows,counts,off,ri,nb,start:0,exits};
}

// laberinto perfecto (backtracking recursivo => pasillos largos)
function carve(g,rand){
  const links=new Set,seen=new Set([g.start]),st=[g.start];
  while(st.length){const c=st[st.length-1],opts=g.nb(c).filter(d=>!seen.has(d));
    if(!opts.length){st.pop();continue}
    const d=opts[Math.floor(rand()*opts.length)];links.add(key(c,d));seen.add(d);st.push(d)}
  return links;
}
function parents(g,links,s){const p=new Map([[s,-1]]),q=[s];
  for(let i=0;i<q.length;i++)for(const d of g.nb(q[i]))if(!p.has(d)&&links.has(key(q[i],d))){p.set(d,q[i]);q.push(d)}
  return p}
function pathTo(p,t){if(!p.has(t))return null;const o=[];for(let c=t;c!==-1;c=p.get(c))o.push(c);return o}

// Corta el camino de cada salida incorrecta (en un punto intermedio) para que no llegue al inicio.
function makeDecoys(g,links,ok,rand){
  for(let k=0;k<3;k++){if(k===ok)continue;
    const p=parents(g,links,g.start),pw=pathTo(p,g.exits[k]);if(!pw)continue;
    const onC=new Set(pathTo(p,g.exits[ok]));
    let m=0;while(!onC.has(pw[m]))m++;
    if(m===0)return false; // la salida incorrecta está en el camino correcto
    const j=Math.floor(m*(0.3+0.4*rand()));
    links.delete(key(pw[j],pw[j+1]));
  }
  return true;
}

function build(shape,level,seed,ok){
  const rand=mulberry(seed);
  const g=shape==='anillos'?thetaGraph(LEVEL_RINGS[level]):gridGraph(LEVEL_GRID[level],MASKS[shape]);
  // A, B, C = salidas ordenadas de izquierda a derecha
  g.exits=g.exits.map(id=>[id,+exitLabel(g,id)[0]]).sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
  let links;
  for(let t=0;t<40;t++){links=carve(g,rand);if(makeDecoys(g,links,ok,rand))break}
  g.links=links;g.solution=pathTo(parents(g,links,g.start),g.exits[ok]);
  return g;
}

// ---------- dibujo ----------
function wallsGrid(g){
  const{n,cells,links,start,exits,xy}=g,s=BS/n,H=new Map,V=new Map;
  const add=(m,line,a)=>{if(!m.has(line))m.set(line,[]);m.get(line).push(a)};
  for(const id of cells){const[x,y]=xy(id);
    const side=(nbId,inGrid,isFwd,draw)=>{
      const inside=inGrid&&cells.has(nbId);
      if(inside?(isFwd&&!links.has(key(id,nbId))):true)draw()};
    if(!(id===start))side(id-n,y>0,false,()=>add(H,y,x));
    if(!exits.includes(id))side(id+n,y<n-1,true,()=>add(H,y+1,x));
    side(id-1,x>0,false,()=>add(V,x,y));
    side(id+1,x<n-1,true,()=>add(V,x+1,y));
  }
  // une segmentos contiguos en líneas largas (más fácil de editar en Illustrator)
  const out=[];
  const merge=(m,horiz)=>{for(const[line,arr]of m){arr.sort((a,b)=>a-b);
    let a=arr[0],b=a+1;
    for(let i=1;i<=arr.length;i++){if(arr[i]===b){b++;continue}
      out.push(horiz?[a,line,b,line]:[line,a,line,b]);a=arr[i];b=a+1}}};
  merge(H,true);merge(V,false);
  return out.map(([x1,y1,x2,y2])=>`<line x1="${f(BX+x1*s)}" y1="${f(BY+y1*s)}" x2="${f(BX+x2*s)}" y2="${f(BY+y2*s)}"/>`);
}
function polar(r,a){const c=BX+BS/2;return[f(c+r*Math.cos(a)),f(BY+BS/2+r*Math.sin(a))]}
function wallsTheta(g){
  const{rows,counts,off,links,exits}=g,h=BS/2/rows,out=[];
  const arc=(r,a1,a2)=>{const[x1,y1]=polar(r,a1),[x2,y2]=polar(r,a2);return`<path d="M${x1} ${y1}A${f(r)} ${f(r)} 0 0 1 ${x2} ${y2}"/>`};
  for(let r=1;r<rows;r++){const n=counts[r],da=2*Math.PI/n;
    for(let i=0;i<n;i++){const id=off[r]+i,a1=i*da,a2=a1+da;
      const inward=r===1?0:off[r-1]+Math.floor(i/(n/counts[r-1]));
      if(!links.has(key(id,inward)))out.push(arc(r*h,a1,a2));
      if(!links.has(key(id,off[r]+(i+1)%n))){const[x1,y1]=polar(r*h,a2),[x2,y2]=polar((r+1)*h,a2);out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`)}
      if(r===rows-1&&!exits.includes(id))out.push(arc(rows*h,a1,a2));
    }}
  return out;
}
function center(g,id){
  if(g.kind==='grid'){const s=BS/g.n,[x,y]=g.xy(id);return[f(BX+(x+.5)*s),f(BY+(y+.5)*s)]}
  if(id===0)return polar(0,0);
  const[r,i]=g.ri(id),h=BS/2/g.rows;return polar((r+.5)*h,(i+.5)*2*Math.PI/g.counts[r]);
}
// posición de la etiqueta (A/B/C) junto a cada salida
function exitLabel(g,id){
  if(g.kind==='grid'){const s=BS/g.n,[x,y]=g.xy(id);return[f(BX+(x+.5)*s),f(BY+(y+1)*s+5)]}
  const[r,i]=g.ri(id);return polar(BS/2+5,(i+.5)*2*Math.PI/g.counts[r]);
}

function render(){
  window.lastMaze=build(S.shape,S.level,S.seed,S.correct);
  page.innerHTML=draw(lastMaze,S.showSolution);
}
// Dibuja la hoja completa; sol=true agrega el camino y marca la respuesta correcta
function draw(g,sol){
  const stroke=`stroke="${S.color}" stroke-width="${S.width}" stroke-linecap="round" fill="none"`;
  const walls=g.kind==='grid'?wallsGrid(g):wallsTheta(g);
  const T=(x,y,size,txt,extra='')=>`<text x="${x}" y="${y}" font-family="Helvetica, Arial, sans-serif" font-size="${size}" text-anchor="middle" ${/fill=/.test(extra)?'':'fill="#222"'} ${extra}>${esc(txt)}</text>`;
  let svg=`<rect width="210" height="297" fill="#fff"/>`;
  svg+=`<g id="textos">${T(105,24,11,S.title,'font-weight="bold"')}${T(105,35,5,S.subtitle)}</g>`;
  // inicio
  if(g.kind==='grid'){const[x,y]=center(g,g.start),top=BY+g.xy(g.start)[1]*BS/g.n;
    svg+=`<g id="inicio">${T(x,f(top-6),4,'INICIO','font-weight="bold"')}<path d="M${x-2} ${f(top-4)}L${x+2} ${f(top-4)}L${x} ${f(top-1)}Z" fill="${S.color}"/></g>`}
  else{const[x,y]=center(g,0);svg+=`<g id="inicio">${T(x,f(+y+1),f(Math.min(3.6,BS/2/g.rows*.45)),'INICIO','font-weight="bold"')}</g>`}
  svg+=`<g id="muros" ${stroke}>${walls.join('')}</g>`;
  if(sol&&g.solution)svg+=`<polyline id="solucion" points="${g.solution.map(id=>center(g,id).join(',')).join(' ')}" fill="none" stroke="#e0245e" stroke-width="${Math.max(.6,S.width*.8)}" stroke-dasharray="1.5 1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  // salidas + respuestas
  let marks='',ans='';
  g.exits.forEach((id,k)=>{const p=exitLabel(g,id),L='ABC'[k];
    marks+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="${S.color}"/>${T(p[0],f(+p[1]+1.5),4,L,'font-weight="bold" fill="#fff"')}`;
    const ax=[47,105,163][k];
    const ok=sol&&k===S.correct;
    ans+=`<rect x="${f(ax-26)}" y="240" width="52" height="22" rx="4" fill="none" stroke="${ok?'#e0245e':S.color}" stroke-width="${ok?1.2:0.5}"/>${T(ax,248,5,L,'font-weight="bold"')}${T(ax,256,4.5,S.answers[k]||'')}`;
  });
  svg+=`<g id="salidas">${marks}</g><g id="respuestas">${ans}</g>`;
  if(sol)svg+=`<g id="clave">${T(105,278,5,'SOLUCIÓN — Respuesta correcta: '+'ABC'[S.correct],'font-weight="bold" fill="#e0245e"')}</g>`;
  return svg;
}

// ---------- estado e interfaz ----------
const $=id=>document.getElementById(id),page=$('page');
const S={shape:'cuadrado',level:0,seed:Date.now()%1e6,correct:0,answers:['Respuesta 1','Respuesta 2','Respuesta 3'],
  title:'Laberinto',subtitle:$('subtitle').value,color:'#5b2f36',width:1.2,showSolution:false};
$('answers').innerHTML=[0,1,2].map(i=>`<div class="ans"><b>${'ABC'[i]}</b><input type="text" data-i="${i}" value="${S.answers[i]}"><input type="radio" name="ok" value="${i}" ${i?'':'checked'} title="Correcta"></div>`).join('');
function update(){
  S.answers=[...document.querySelectorAll('#answers input[type=text]')].map(i=>i.value);
  S.correct=+document.querySelector('input[name=ok]:checked').value;
  S.shape=$('shape').value;S.title=$('title').value;S.subtitle=$('subtitle').value;
  S.color=$('color').value;S.width=+$('width').value;S.showSolution=$('solution').checked;
  $('seedTxt').textContent=S.seed;
  render();
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',update));
document.querySelectorAll('#level button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#level button').forEach(x=>x.classList.toggle('on',x===b));S.level=+b.dataset.v;update()});
$('new').onclick=()=>{S.seed=Math.floor(Math.random()*1e6);update()};

const svgText=sol=>`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">${draw(lastMaze,sol)}</svg>`;
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const fname=(ext,suf='')=>`laberinto-${S.shape}-nivel${S.level+1}-${S.seed}${suf}.${ext}`;
// cada descarga lleva su hoja de respuesta
$('svg').onclick=()=>{
  download(new Blob([svgText(false)],{type:'image/svg+xml'}),fname('svg'));
  setTimeout(()=>download(new Blob([svgText(true)],{type:'image/svg+xml'}),fname('svg','-solucion')),400);
};
$('pdf').onclick=async()=>{
  if(!window.jspdf){window.print();return} // sin internet: usar "Guardar como PDF" del navegador
  const doc=new jspdf.jsPDF({unit:'mm',format:'a4'});
  page.innerHTML=draw(lastMaze,false);await doc.svg(page,{x:0,y:0,width:210,height:297});
  doc.addPage();page.innerHTML=draw(lastMaze,true);await doc.svg(page,{x:0,y:0,width:210,height:297});
  page.innerHTML=draw(lastMaze,S.showSolution);
  doc.save(fname('pdf'));
};
update();
</script>
</body>
</html>
